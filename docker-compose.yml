services:

  POSTGRES:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - POSTGRES-DATA:/var/lib/postgresql/data
    networks:
      - MyNetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  BACKEND:
    build: ./BackEND
    image: newbackend  
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    depends_on:
      POSTGRES:
        condition: service_healthy
    networks:
      - MyNetwork
    develop:
      watch:
        - action: sync
          path: ./BackEND
          target: /app
          ignore:
            - __pycache__/
            - "*.sqlite3"
        - action: rebuild
          path: ./BackEND/requirements.txt
        - action: rebuild
          path: ./BackEND/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/db/')\""]
      interval: 15s
      timeout: 10s
      retries: 3

  FRONTEND:
    build: ./FrontEND
    image: newfrontend
    restart: always
    depends_on:
      BACKEND:
        condition: service_healthy
    networks:
      - MyNetwork    
    develop:
      watch:
        - action: sync
          path: ./FrontEND
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./FrontEND/package.json
        - action: rebuild
          path: ./FrontEND/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

  NGINX:
    image: nginx:alpine
    restart: always
    depends_on:
      FRONTEND:
        condition: service_healthy
      BACKEND:
        condition: service_healthy
    volumes:
      - ./NGINX/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - MyNetwork
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

volumes:
  POSTGRES-DATA:

networks:
  MyNetwork:
    driver: bridge