services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - POSTGRES-DATA:/var/lib/postgresql/data
    networks:
      - backend-database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./BackEND
    image: lallireza/backend:${TAG:-latest}-dev
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./NGINX/nginx.crt:/nginx.crt:ro
      - ./NGINX/nginx.key:/nginx.key:ro
    networks:
      - frontend-backend-network
      - backend-database-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl, urllib.request; ctx = ssl._create_unverified_context(); urllib.request.urlopen('https://127.0.0.1:8000/api/health/db/', context=ctx, timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.31-alpine
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./NGINX/nginx.crt:/etc/nginx/certs/nginx.crt:ro
      - ./NGINX/nginx.key:/etc/nginx/certs/nginx.key:ro
    ports:
      - "8080:80"
      - "443:443"
    networks:
      - frontend-backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

volumes:
  POSTGRES-DATA:

networks:
  frontend-backend-network:
    driver: bridge
  backend-database-network:
    driver: bridge