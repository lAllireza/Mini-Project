services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPORT: 5433
    ports:
      - "5433:5433"
    networks:
      - backend-database-network
    volumes:
      - POSTGRES-DATA:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${GITHUB_OWNER}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5433
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
    ports:
      - "8001:8001"
    networks:
      - backend-database-network
      - frontend-backend-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request; resp = urllib.request.urlopen('https://127.0.0.1:8001/api/health/db/', timeout=5); data = json.loads(resp.read()); exit(0 if data.get('status') == 'success' else 1)\""
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${GITHUB_OWNER}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - frontend-backend-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  POSTGRES-DATA:

networks:
  frontend-backend-network:
    driver: bridge
  backend-database-network:
    driver: bridge
    internal: true  