name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "new", "test" ]
  pull_request:
    branches: [ "main", "new", "test" ]

jobs:
  # ۱. بررسی‌های بک‌اند (در پوشه BackEND)
  backend-checks:
    runs-on: ubuntu-latest

    # دیتابیس تست برای manage.py check / manage.py test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    # این دستور باعث می‌شود تمام stepها به صورت پیش‌فرض داخل پوشه BackEND اجرا شوند
    defaults:
      run:
        working-directory: ./BackEND

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 . --max-line-length=100

      - name: Django Check
        run: python manage.py check

      - name: Run Django Tests
        run: python manage.py test

  # ۲. بررسی‌های فرانت‌اند (در پوشه FrontEND)
  frontend-checks:
    runs-on: ubuntu-latest
    # تمام دستورات فرانت‌اند به صورت پیش‌فرض در این پوشه اجرا خواهند شد
    defaults:
      run:
        working-directory: ./FrontEND

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint

      - name: Build Frontend
        run: npm run build

  # ۳. تشخیص خودکار نسخه‌ی بعدی بر اساس فرمول سفارشی (جمع مستقل هر بخش، بدون صفر کردن)
  #    فقط روی پوش مستقیم به main اجرا می‌شود (نه روی pull request).
  #    قوانین: هر fix: -> +۱ patch | هر feat: -> +۱ minor | هر feat!:/BREAKING CHANGE -> +۱ major
  auto-tag:
    needs: [backend-checks, frontend-checks]
    if: |
      github.event_name == 'push' &&
      contains(fromJSON('["refs/heads/main", "refs/heads/new", "refs/heads/test"]'), github.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      skip: ${{ steps.bump.outputs.skip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # تاریخچه‌ی کامل لازم است تا کامیت‌های بعد از آخرین تگ قابل بررسی باشند
          fetch-depth: 0

      - name: Compute next version
        id: bump
        run: python3 .github/scripts/bump_version.py

      - name: Create and push tag
        if: steps.bump.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}

  # ۴. ساخت و پوش کردن کانتینرهای داکر
  docker-build-push:
    needs: auto-tag
    if: needs.auto-tag.outputs.skip != 'true'
    runs-on: ubuntu-latest

    # دسترسی لازم برای نوشتن ایمیج‌ها در بخش Packages گیت‌هاب
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ورود به Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ورود به GitHub Container Registry (ghcr.io)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # این توکن به صورت خودکار توسط گیت‌هاب ساخته می‌شود

      # استخراج تگ‌های بک‌اند (برای داکر هاب و گیت‌هاب به صورت همزمان)
      - name: Extract backend tags
        id: backend_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/backend
            ghcr.io/${{ github.repository_owner }}/backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.auto-tag.outputs.new_tag }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v6
        with:
          # مسیر اجرای داکر را به پوشه بک‌اند تغییر دادیم
          context: ./BackEND
          file: ./BackEND/Dockerfile
          target: prod-stage
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

      # استخراج تگ‌های فرانت‌اند (برای داکر هاب و گیت‌هاب به صورت همزمان)
      - name: Extract frontend tags
        id: frontend_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/frontend
            ghcr.io/${{ github.repository_owner }}/frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.auto-tag.outputs.new_tag }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v6
        with:
          # مسیر اجرای داکر را به پوشه فرانت‌اند تغییر دادیم
          context: ./FrontEND
          file: ./FrontEND/Dockerfile
          target: prod-stage
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}

  # ۵. ساخت خودکار GitHub Release روی تگ‌ها
  create-release:
    needs: auto-tag
    if: needs.auto-tag.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # دسترسی لازم برای ساخت Release در گیت‌هاب

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.auto-tag.outputs.new_tag }}
          name: Release ${{ needs.auto-tag.outputs.new_tag }}
          generate_release_notes: true # ساخت خودکار متن تغییرات بر اساس کامیت‌ها
