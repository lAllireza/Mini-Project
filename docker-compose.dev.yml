services:
  postgres:
    image: postgres:15-alpine
    ports:
      - 5432:5432

  backend:
    build: ./backend
    image: lallireza/backend:${TAG:-latest}-dev
    ports:
      - 8000:8000
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/
            - "*.sqlite3"
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile 

  frontend:
    build:
      context: ./frontend
      target: dev-stage
    image: lallireza/frontend:${TAG:-latest}-dev
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 3000:3000
    volumes:
      - ./nginx/nginx.crt:/certs/nginx.crt:ro
      - ./nginx/nginx.key:/certs/nginx.key:ro
    networks:
      - frontend-backend-network
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.31-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro